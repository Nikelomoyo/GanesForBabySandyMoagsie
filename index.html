<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Baby 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--card:#fffaf0;--ink:#5a2a49;--pink:#ff6fa5;--lilac:#b79af5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;background:linear-gradient(135deg,#ffe3ee,#e9defa,#ffd9e8,#fff0d9);background-size:300% 300%;animation:bgm 12s ease infinite;color:var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:manipulation}
#bar{width:min(92vw,420px);margin:12px 0 4px;z-index:2;text-align:center}
.track{height:16px;background:#fff;border-radius:99px;box-shadow:inset 0 2px 4px #e9c8dc;position:relative}
#fill{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff9ac1,#ff6fa5,#b79af5);transition:width .8s cubic-bezier(.3,1.5,.5,1);position:relative}
#fill::after{content:'💖';position:absolute;right:-12px;top:-9px;font-size:24px;animation:beat 1s infinite}
#lbl{font-size:14px;font-weight:700;color:#a24d7e}
#card{z-index:2;background:var(--card);border:3px solid #ffd1e3;border-radius:30px;box-shadow:0 0 0 6px rgba(255,255,255,.5),0 14px 36px rgba(255,111,165,.35);width:min(92vw,420px);padding:22px 18px;margin:auto 0;text-align:center;animation:flip .6s cubic-bezier(.3,1.4,.5,1);max-height:84%;overflow-y:auto}
.em{font-size:66px;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(255,111,165,.4))}
h2{font-size:21px;line-height:1.3;margin:8px 0 10px;font-weight:800}
#msg{min-height:28px;font-size:16px;font-weight:700;color:#d6458a;margin-bottom:10px}
.row{display:flex;flex-direction:column;gap:12px;align-items:center}
button{font-family:inherit;font-size:19px;font-weight:700;border:none;border-radius:999px;padding:14px 22px;min-width:210px;color:#fff;background:var(--lilac);box-shadow:0 5px 0 #8c6fd0;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8c6fd0}
button.yes{background:var(--pink);box-shadow:0 5px 0 #d94b84;animation:beat 1.6s infinite}
button.glow{background:#2ee07a;box-shadow:0 0 0 4px #b8ffd6,0 0 30px 10px #2ee07a;animation:pulse .7s infinite}
#no.fly{position:fixed;z-index:20;min-width:0;transition:left .3s ease,top .3s ease}
#over{position:fixed;inset:0;z-index:30;background:#fff0f6;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
#over::before{content:'';position:absolute;inset:-60%;background:conic-gradient(#ffd1e3,#fff,#e9defa,#fff,#ffd1e3);animation:spin 9s linear infinite;opacity:.7}
#over>*{position:relative}
#over.on{display:flex;animation:flip .5s}
#over .big{font-size:92px;animation:bob 1s infinite}
#over h1{font-size:30px;margin:8px 0}
#over p{font-size:18px;max-width:340px;margin:0 0 20px}
.bit,.tap,.bg{position:fixed;pointer-events:none}
.bit{top:-40px;z-index:40;animation:fall linear forwards}
.bg{bottom:-40px;z-index:1;opacity:.55;animation:float linear forwards}
.tap{z-index:50;animation:up .9s forwards}
.shake{animation:shake .4s}
#reasons{text-align:left;font-size:17px;margin:10px 0}
#reasons div{opacity:0;transform:translateY(10px);transition:.6s;margin:7px 0}
#reasons div.show{opacity:1;transform:none}
@keyframes flip{from{transform:perspective(600px) rotateY(-70deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}
@keyframes beat{50%{transform:scale(1.1)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes float{to{transform:translateY(-115vh) translateX(30px)}}
@keyframes up{to{transform:translateY(-70px) scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bgm{50%{background-position:100% 100%}}
</style>
</head>
<body>
<div id="bar"><div class="track"><i id="fill"></i></div><div id="lbl"></div></div>
<div id="card"></div>
<div id="over"><div class="big" id="oe"></div><h1 id="ot"></h1><p id="os"></p><button class="yes" id="next">Next 💕</button></div>

<script>
/* ===== EDIT ALL TEXT HERE ===== */
// c = what happens if she catches the moving No: 'lock' (can't), 'give' (game gives up), 'mad' (game gets angry + faster)
const STAGES = [
 { type:'ult', c:'lock', e:'🍣', q:`Baby, choose wisely…\nNikelo or a whole sushi roll you can finish ALL by yourself?`, yes:`Nikelo 💖`, no:`The sushi roll 🍣`,
   win:`I KNEW you loved me! 🥰`, sub:`Honestly? You'd just beg me to finish it anyway. Teamwork. 🍣` },
 { type:'riddle', e:'💋', q:`Riddle time!\nWho is the shy boy who chickened out of kissing you SO many times… but finally did it?`,
   opts:[`A very brave pigeon 🐦`,`Nikelo 🙈`,`Ryan Gosling 😎`], right:1, hints:[`Pigeons are not that romantic 😂 Try again, Baby!`,``,`Ryan would NOT have chickened out 😭 Try again!`],
   win:`Yep, that was me! 🙈`, sub:`I was SO nervous. Thank you for waiting for me. 💋` },
 { type:'ult', c:'give', e:'🍕', q:`Nikelo or pizza?\n(Pizza started us, so this is a tough one 👀)`, yes:`Nikelo 💖`, no:`Pizza 🍕`,
   win:`Aww, I'm blushing! 😳`, sub:`We WILL get pizza again one day. Eventually. Probably. We keep failing, but I believe. 🍕` },
 { type:'ult', c:'mad', e:'📏', q:`Baby, you're 6'7"… allegedly.\nWill you admit Nikelo is a tiny bit taller than you? (5'3" says hi 👋)`, yes:`Fine, he's taller 😤💖`, no:`No, I'm 6'7"! 👑`,
   win:`THE GIANT HAS SPOKEN! 🥹`, sub:`Okay Your Highness 6'7", you can look down on me forever. I'll look up at you. 💕` },
 { type:'fav', e:'🌊', q:`Serious question…\nWho drowned harder that day?`, yes:`Me (Baby) 😭`, no:`Nikelo 🤨`,
   winYes:{win:`I knew it! 🌊`, sub:`Facts. You drowned HARDER. But we drowned together, and that's the best kind. 💕`},
   winNo:{win:`Aww, protecting my pride! 🥹`, sub:`Cute try, but we both know the truth: you drowned harder. Still love you. 😂💖`} },
 { type:'ult', c:'lock', e:'🎬', q:`Nikelo or a movie that you actually finish?\n(It took us 9 movies to finish 1, remember? 🍿)`, yes:`Nikelo 💖`, no:`A whole movie 🎬`,
   win:`Movie night with you wins! 🍿`, sub:`9 tries and counting. I'd start a 10th with you any day. 🎬` },
 { type:'riddle', e:'🚰', q:`Riddle me this…\nWho fell asleep after some very cosy cuddles and woke up to a FLOODED house because someone forgot to close the tap?`,
   opts:[`Nikelo 🙋‍♂️`,`The tap, it has a mind of its own 🚰`,`Baby 🙈`], right:2, hints:[`Nope! I was asleep and innocent 😂 Try again!`,`The tap is innocent! Try again 😂`,``],
   win:`Yes, you! 🌊🏠`, sub:`And I'd happily wade through that whole house again, as long as it's with you. 💕` },
 { type:'ult', c:'mad', e:'🍗', q:`Remember our little scare, when we skipped Plan B and bought wings instead?\nAdmit it, Baby… that decision was all YOU 😏`, yes:`Okay, guilty 🙈🍗`, no:`Not me! 😤`,
   win:`GUILTY! 😂`, sub:`Best worst decision ever. I love you, bad decisions and all. 🍗💖` },
 { type:'ult', c:'give', e:'🧊', q:`You were SO amazed that I had TWO fridges 🧊🧊\nNikelo and his two fridges, or a man with zero fridges?`, yes:`Nikelo & fridges 💖`, no:`Zero fridges 🫥`,
   win:`Fridge king! 👑`, sub:`Two fridges and one very lucky me. Everything inside is yours too. 🧊💕` },
 { type:'ult', c:'lock', e:'🏡', q:`Remember when you embarrassed yourself in front of the neighbours? 🙈\nNikelo, or a life where nobody ever saw THAT?`, yes:`Nikelo (and the neighbours 😂)`, no:`A neighbour-free life 🫣`,
   win:`Iconic, honestly! 😂`, sub:`The neighbours still talk about it. I think it's one of the cutest things you've ever done. 💕` },
 { type:'riddle', e:'🐶', q:`The big question…\nWho is the WORST dog owner?\n(Yours thought her pup was just sleeping. Mine ran away and I didn't even notice 😭)`,
   opts:[`Baby 🐶`,`Nikelo 🏃‍♂️🐕`,`Both of us, equally 🤝`], right:2, hints:[`Hmm, you loved your pup so much! Mine literally ran away and I didn't notice 😭 Try again!`,`I DID lose a whole dog… but think again 🤔`,``],
   win:`Both of us! 🐾`, sub:`We weren't perfect, but we loved them so much. And you're the best dog mum I know. 🕊️💕` },
 { type:'ult', c:'mad', e:'🧸', q:`Nikelo's hugs or the warmest, fluffiest blanket in the whole world?`, yes:`Nikelo's hugs 🤗💖`, no:`The blanket 🛏️`,
   win:`My favourite place! 🤗`, sub:`Your head fits right under my chin like it was made for it. 🧸` },
 { type:'riddle', e:'💭', q:`Riddle time!\nI think of you when I wake up, I text you goodnight, and my heart skips when you smile. Who am I?`,
   opts:[`Your phone 📱`,`Nikelo 🥰`,`Your alarm clock ⏰`], right:1, hints:[`Your phone doesn't have a heart! 😂 Try again!`,``,`An alarm clock only annoys you. I only adore you 😂 Try again!`],
   win:`It's me! 🥰`, sub:`Every morning, every night, always you. 💭💖` },
 { type:'ult', c:'mad', e:'🍟', q:`Nikelo or the LAST fry on the plate?\n(Think carefully, I've seen what you do for the last fry 👀)`, yes:`Nikelo 💖`, no:`The last fry 🍟`,
   win:`Real love! 🥹`, sub:`I'd give you my last fry. Probably. Okay, maybe half. 🍟💕` },
 { type:'riddle', e:'🌪️', q:`Plot twist riddle!\nBaby is 6'7" (allegedly), drowned the hardest, flooded a house and caused a wings situation. What is her superpower?`,
   opts:[`Chaos 🌪️`,`Being the cutest human alive 🥰`,`Both, obviously 😂`], right:2, hints:[`True, but that's only half of it 😂 Try again!`,`Also true, but you're forgetting the flood 🌊 Try again!`,``],
   win:`BOTH!! 😂`, sub:`Chaos AND cuteness, a legendary combo. Never change, I love every bit of it. 💖` },
 { type:'ult', c:'give', e:'💍', q:`The big one, Baby…\nWill you be mine forever?`, yes:`Forever and ever 💖`, no:`Hmm, nope 😏`,
   win:`FOREVER!! 🥹💍`, sub:`I'll be the shy guy, the two-fridge guy, the lost-dog guy… all yours, always. 💖` }
];
const FINALE = {
 title:`Dear Baby 💌`, msg:`Out of every riddle and every choice, you are my favourite answer. Here is why:`,
 reasons:[`🍣 You beg me to finish your sushi`,`💋 You waited while I chickened out`,`🍕 You're my pizza girl, the start of us`,`📏 You're 6'7" in my heart`,`🌊 You drowned harder, and I'd drown with you again`,`🎬 You stuck with me through 9 movies`,`🚰 You flooded the house and I still adore you`,`🍗 You're my favourite bad decision`,`🧊 You were amazed by my two fridges`,`🏡 You made the neighbours' day`,`🐾 You love your pups so deeply`,`🧸 You fit perfectly in my arms`,`💭 You're on my mind every day`,`🌪️ You're my favourite chaos`,`💍 You're my forever`],
 last:`You chose me all 17 times, Baby. I'd choose you every time too. ❤️`, sign:`— Nikelo`
};
/* ===== RANDOM LINES (the No button never says the same thing twice in a row) ===== */
const ASK=[`Are you sure? 🥺`,`Come on, be honest… 👀`,`Wait, really?? 😳`,`Think of my poor heart 💔`,`Be real with me right now 🤨`,`Baby… did your finger slip? 🙈`,`I don't think you meant that 😌`,`Last chance to fix this 😘`,`Ouch. Are you SURE-sure? 🥲`,`Say it to my face 😤💕`];
const SURE=[`Yes, I'm sure`,`100% sure`,`Absolutely`,`I said what I said`,`Yep, certain 😤`];
const BACK=[`Wait, no 🥹`,`Okay okay, go back 🙈`,`Let me rethink 💕`,`Oops, my bad 😘`];
const PHEW=[`Phew, my heart 🥹`,`Knew you'd come back 💕`,`That was close 😅`,`There she is 😌💖`];
const PSST=[`Psst… press YES instead 💕`,`The No button is shy, try Yes 🙈`,`Oops, it ran away! Try YES 💖`,`No got scared. Press Yes? 🥰`,`No left the chat. Yes is right there 😏`];
const CHASE=[`Too slow! Just press YES 😝💚`,`Can't catch it, can you? 😂`,`Look how Yes glows for you ✨`,`It's tired of you. Press Yes 💚`,`Give up and press the green button 🫶`,`Catch me if you can 😜`];
const MAD=[`HEY!! 😡 You touched it! It's mad now!`,`Rude!! 😠 Now it's FAST`,`Grrr 😤 You asked for this`,`NOT the No button!! 😡`];
const GIVE=[`Okay fine… you win 😔`,`Okay fine… I give up 🥺`,`Okay fine, you caught it 😭`];
const GIVE2=[`…jk, I'm choosing us for you 😘`,`…just kidding, you're stuck with me 💕`,`…psych, I can't lose to you 🥰`];
/* ===== GAME CODE ===== */
const $=id=>document.getElementById(id), card=$('card'), over=$('over'), T=STAGES.length+1, last={};
let i=0, mode=0, timer=null, tt=null;
const pick=(a,k)=>{let n;do{n=Math.floor(Math.random()*a.length)}while(a.length>1&&n===last[k]);last[k]=n;return a[n]};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function bar(){ $('fill').style.width=(i/T*100)+'%'; $('lbl').textContent=i>=T?'Stage '+T+' / '+T+' 💞':'Stage '+(i+1)+' / '+T+' 💞'; }
function bit(chars,cls,dur){ const s=document.createElement('span'); s.className=cls; s.textContent=chars[Math.floor(Math.random()*chars.length)];
 s.style.left=Math.random()*95+'vw'; s.style.fontSize=(16+Math.random()*24)+'px'; s.style.animationDuration=dur+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),dur*1000); }
function confetti(n,ch){ for(let k=0;k<n;k++) setTimeout(()=>bit(ch||['💖','💕','✨','🌸','💗','🎉','💜','🌹'],'bit',2+Math.random()*2),k*40); }
setInterval(()=>bit(['💗','💕','💖','✨','🌸'],'bg',6+Math.random()*4),700);
addEventListener('pointerdown',e=>{ for(let k=0;k<3;k++){ const s=document.createElement('span'); s.className='tap'; s.textContent=['💖','💕','✨'][k]; s.style.left=(e.clientX-10+Math.random()*40-20)+'px'; s.style.top=e.clientY+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),900); } });

function intro(){ bar(); card.innerHTML=`<div class="em">💌</div><h2>A little game for my Baby 💖</h2><div id="msg">16 questions. 1 very important answer.</div><div class="row"><button class="yes" id="go">Open 💌</button></div>`; $('go').onclick=()=>{vib(30);confetti(30);show()}; }
function show(){
 clearInterval(timer); clearTimeout(tt); mode=0; bar(); const s=STAGES[i]; if(!s) return finale();
 const b = s.type==='riddle' ? s.opts.map((o,k)=>`<button data-k="${k}">${o}</button>`).join('') : `<button class="yes" id="yes">${s.yes}</button><button id="no">${s.no}</button>`;
 card.innerHTML=`<div class="em">${s.e}</div><h2>${s.q.replace(/\n/g,'<br>')}</h2><div id="msg"></div><div class="row" id="btns">${b}</div>`;
 card.style.animation='none'; void card.offsetWidth; card.style.animation='';
 if(s.type==='riddle') card.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{ const k=+el.dataset.k; vib(20);
   if(k===s.right) win(s); else { $('msg').textContent=s.hints[k]; el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); } });
 else if(s.type==='fav'){ $('yes').onclick=()=>win(s.winYes); $('no').onclick=()=>win(s.winNo); }
 else { $('yes').onclick=()=>win(s); $('no').onclick=onNo; }
}
function jump(){ const n=$('no'); if(!n) return; n.classList.add('fly'); const w=innerWidth-n.offsetWidth-12, h=innerHeight-n.offsetHeight-12;
 n.style.left=Math.max(6,Math.random()*w)+'px'; n.style.top=Math.max(6,Math.random()*h)+'px'; }
function onNo(){
 vib(15); const s=STAGES[i], msg=$('msg'), b=$('btns');
 if(mode===0){
  mode=-1; msg.textContent=pick(ASK,'a'); b.style.display='none';
  const c=document.createElement('div'); c.className='row'; c.innerHTML=`<button id="sure">${pick(SURE,'s')}</button><button class="yes" id="back">${pick(BACK,'b')}</button>`; card.appendChild(c);
  $('back').onclick=()=>{ c.remove(); b.style.display=''; msg.textContent=pick(PHEW,'p'); mode=0; };
  $('sure').onclick=()=>{ c.remove(); b.style.display=''; mode=1; msg.textContent=pick(PSST,'q'); jump(); };
 } else if(mode===1){
  mode=2; msg.textContent=pick(CHASE,'c'); if(s.c==='lock') $('no').style.pointerEvents='none'; $('yes').classList.add('glow'); timer=setInterval(jump,420); jump();
 } else if(mode===2){
  if(s.c==='mad') mad(); else if(s.c==='give') give();
 }
}
function mad(){ mode=3; clearInterval(timer); const n=$('no'); n.textContent='😡'; n.style.pointerEvents='none'; n.style.transition='left .12s,top .12s'; n.style.background='#ff4d4d';
 $('msg').textContent=pick(MAD,'m'); card.classList.add('shake'); confetti(12,['😡','💢','😤']); vib([80,30,80]); timer=setInterval(jump,160); }
function give(){ mode=3; clearInterval(timer); $('no').style.display='none'; $('msg').textContent=pick(GIVE,'g'); vib(40);
 tt=setTimeout(()=>{ $('msg').textContent=pick(GIVE2,'h'); tt=setTimeout(()=>win(STAGES[i]),1300); },1500); }
function win(s){
 clearInterval(timer); clearTimeout(tt); vib([60,40,60]); i++; bar();
 $('oe').textContent=['🥰','😍','🤩','💖','🥹','😘','💞','🫶'][Math.floor(Math.random()*8)];
 $('ot').textContent=s.win; $('os').textContent=s.sub; over.classList.add('on'); confetti(70);
}
$('next').onclick=()=>{ over.classList.remove('on'); show(); };
function finale(){
 i=T; bar(); const f=FINALE; confetti(120);
 card.innerHTML=`<div class="em">💖</div><h2>${f.title}</h2><div style="font-size:17px">${f.msg}</div><div id="reasons">${f.reasons.map(r=>`<div>${r}</div>`).join('')}</div><h2 id="last" style="opacity:0;transition:1s">${f.last}<br>${f.sign}</h2>`;
 const items=[...card.querySelectorAll('#reasons div')];
 items.forEach((d,k)=>setTimeout(()=>{ d.classList.add('show'); card.scrollTop=card.scrollHeight; confetti(8); vib(20); },1000*(k+1)));
 setTimeout(()=>{ $('last').style.opacity=1; card.scrollTop=card.scrollHeight; timer=setInterval(()=>confetti(14),900); },1000*(items.length+1));
}
intro();
</script>
</body>
</html>
